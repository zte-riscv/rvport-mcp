# spec 源仓库配置：执行 build_kb.sh 时缺失的仓库会按此自动 clone。
#
# 字段：
#   url     git 克隆地址（https）
#   pin     克隆后 checkout 的提交；必须是完整 40 位哈希或分支/标签名
#           （GitHub 按哈希 fetch 只认完整 SHA，短哈希会被构建器拒绝）
#   dest    doc/ 下的目标目录（KB_SPECS 中的 repo 名与此对应）
#
# 升级 spec：改 pin 为新提交的完整哈希（git ls-remote <url> 或仓库内
# git rev-parse HEAD），删掉 doc/<dest>/ 后重跑 build_kb.sh。
# 网络不通时，手动把仓库放到 doc/<dest>/ 即可跳过 clone。

